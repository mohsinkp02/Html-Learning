<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1:last-child{
            color:red;
        }
        p:last-child{
            color:blue;
        }
    </style>
</head>
<body>
    <h1>last child pseudo class selector</h1>
    <p>It will target the specified element if it is the last child of its parent element.</p>
    <div>
        <h1>first -child , first of type</h1>
        <p>first-of-type, last-of-type </p>
        <img src="" alt="first-of-type, last-of-type">
        <h1>last-of-type</h1>
        <span>
            <h1>first-child, first-of-type, last-of-type</h1>
            <p>first-of-type</p>
            <p>last-child, last-of-type</p>
        </span>
    </div>
</body>
</html>
