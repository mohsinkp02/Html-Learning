<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a::before{
            content:'hello ';
        }
        li::after{content:' 👌'}
    </style>
</head>
<body>
    <h1>before pseudo element selector</h1>
    <p>used to add some content before the content of any element.</p>
    <a href="">click</a>
    <ul>
        <li>items1</li>
        <li>items2</li>
        <li>items3</li>
        <li>items4</li>
        <li>items5</li>
    </ul>
    <button><a href="./pseudoele.html">Return</a></button>
</body>
</html>
