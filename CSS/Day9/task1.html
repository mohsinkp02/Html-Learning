<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul{
            display: grid;
            grid-template-columns: repeat(4,1f);
            grid-template-rows: repeat(3,1f);
            list-style-type: none;
            column-gap: 20px;
            row-gap: 20px;
            height: 300px;
        }
        #child1{
            grid-row: 1/4;
            grid-column: 1/2;
            background-color: green;
        }
        #child2{
            grid-column: 2/4;
            grid-row: 1/2;
            background-color: green;

        }
        #child3{
            background-color: red;
        }
        #child4{
            grid-column: 2/3;
            grid-row: 2/3;
            background-color: orange;
        }
        #child5{
            grid-column: 3/4;
            grid-row: 2/3;
            background-color: red;
        }
        #child6{
            grid-column: 4/5;
            grid-row: 2/4;
            background-color: green;
        }
        #child7{
            grid-column: 2/3;
            grid-row: 3/4;
            background-color: red;
        }
        #child8{
            grid-column: 3/4;
            grid-row: 3/4;
            background-color: orange;
        }
        
        

    </style>
</head>
<body>
    <div id="main">
        <ul>
            <li id="child1"></li>
            <li id="child2"></li>
            <li id="child3"></li>
            <li id="child4"></li>
            <li id="child5"></li>
            <li id="child6"></li>
            <li id="child7"></li>
            <li id="child8"></li>
        </ul>
    </div>
</body>
</html>
