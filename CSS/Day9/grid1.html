<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul{
            border: 3px solid red;
            list-style-type: none;
            padding-left: 0px;
            display: grid;
            grid-template-columns: repeat(2,1fr);
            grid-template-rows: repeat(2,fr);
            row-gap: 20px;
            column-gap: 20px;
        }
        li{
            background-color: blueviolet;
            color: white;
            font-size: 30px;
        }
        /* #child3{
            grid-column-start: 1;
            grid-column-end: 3;
        } */

        #child2{
            grid-row-start: 1;
            grid-row-end: 3;
            grid-column-start: 2;
            grid-column-start: 3;
            
        }
    </style>
</head>
<body>
    <ul>
        <li id="child1">list items1</li>
        <li id="child2">list items2</li>
        <li id="child3">list items3</li>
        
    </ul>
</body>
</html>
