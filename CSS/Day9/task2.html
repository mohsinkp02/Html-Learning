<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul{
            display: grid;
            grid-template-columns: repeat(3,1f);
            grid-template-rows: repeat(4,1f);
            list-style-type: none;
            column-gap: 20px;
            row-gap: 20px;
            height: 300px;
            padding: 0px;
            width: 500px;
        }
        li{
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #child1{
            grid-row: 1/2;
            grid-column: 1/4;
            background-color: blue;
        }
        #child2{
            grid-column: 1/2;
            grid-row: 2/4;
            background-color:aqua;
        }
        #child3{
            grid-row: 2/3;
            grid-column: 2/4;
            background-color: rgba(49, 142, 248, 0.909);
        }
        #child4{
            grid-row: 3/4;
            grid-column: 2/3;
            background-color: rgba(49, 142, 248, 0.909);
        }
        #child5{
            grid-row: 3/4;
            grid-column: 3/4;
            background-color: blue;
        }
        #child6{
            grid-row: 4/5;
            grid-column: 1/4;
            background-color: blue;
        }
        

    </style>
</head>
<body>
    <div>
        <ul>
            <li id="child1">Header</li>
            <li id="child2">Sidebar</li>
            <li id="child3">Content 1</li>
            <li id="child4"> Content 2</li>
            <li id="child5">Content 3</li>
            <li id="child6">Footer</li>
        </ul>
    </div>
</body>
</html>
