<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #parent{
            display: flex;
            justify-content: center;
            position: relative;
            top: 300px;
            gap: 30px;
        }
        .dot{
            height: 10px;
            width: 10px;
            border: 3px solid red;
            background-color: black;
            border-radius: 50%;
            animation: loader 3s linear 0s infinite ;
            transition: all 1s;
        }
        #dot1{
            animation-delay: 0s;
        }
        #dot2{
            animation-delay: 1s;
        }
        #dot3{
            animation-delay: 2s;
        }
        
        @keyframes loader {
            0%,100%{
                transform: translateY(0px);
            }
            
            50%{
                transform: translateY(-40px);
            }
        }
    </style>
</head>
<body>
    <div id="parent">
        <div id="dot1" class="dot"></div>
        <div id="dot2" class="dot"></div>
        <div id="dot3" class="dot"></div>
    </div>
</body>
</html>
