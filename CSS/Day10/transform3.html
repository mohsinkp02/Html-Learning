<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        .parent{
            display: flex;
            justify-content: space-around;
        }
        #div1,#div2,#div3,#div4,#div5 {
            height: 200px;
            width: 200px;
            background-color: blueviolet;
            transition: all 3s;

        }

        #div1:hover {
            transform: scale(1.5);
            border-radius: 70px;
        }
        #div2:hover {
            transform: scale(2,3);
            border-radius: 70px;
        }
        #div3:hover {
            transform: scaleX(1.5);
        }
        #div4:hover {
            transform: scaleY(1.5);
        }
        #div5:hover {
            transform: scale(0.5);
        }

    </style>
</head>

<body>
    <h1>Transform Property</h1>
    <div class="parent">
        <div id="div1"></div>
        <div id="div2"></div>
        <div id="div3"></div>
        <div id="div4"></div>
        <div id="div5"></div>
    </div>
    <div class="parent">
        <p>scale(1.5)</p>
        <p>scale(2,3)</p>
        <p>scaleX(1.5)</p>
        <p>scaleY(1.5)</p>
        <p>scale(0.5)</p>
    </div>
</body>

</html>
