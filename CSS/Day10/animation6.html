<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #div1{
            height: 200px;
            width: 200px;
            background-color: blueviolet;
            animation: movingele 3s linear 0s infinite ;
        }

        @keyframes movingele {
            0%{
                margin-top: 0px;
                margin-left: 0px;
            }
            25%{
                margin-top: 0px;
                margin-left: 400px;
            }
            
            50%{
                margin-top: 400px;
                margin-left: 400px;
            }
            75%{
                margin-top: 400px;
                margin-left:0px;
            }
            100%{
                margin-top: 0px;
                margin-left:0px;
            }
            
        }
        
        
    </style>
</head>
<body>
    <div id="div1"></div>
</body>
</html>
