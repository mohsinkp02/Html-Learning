<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        span{
            border: 2px solid red;
            display: block;
            height: 100px;
            width: 100px;
        }
    </style>
</head>
<body>
    <h1>display:block; property</h1>
    <p>It will convert the inline level element into block level element.</p>
    <span>Hello World</span>
    <span>Hello World</span>
</body>
</html>
