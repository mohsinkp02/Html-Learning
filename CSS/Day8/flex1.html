<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul{
            border: 2px solid red;
            /* height: 300px; */
            list-style-type: none;
            padding-left: 0px;
            display: flex;
            flex-direction: row;

            flex-wrap: wrap;

        }
        li{

        }

    <ul>
        <li>list items1</li>
        <li>list items2</li>
        <li>list items3</li>
        <li>list items4</li>
        <li>list items5</li>
    </ul>

</html>
