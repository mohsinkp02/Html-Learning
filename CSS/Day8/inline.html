<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            border: 2px solid red;
            display: inline;
        }
    </style>
</head>
<body>
    <h1>display:inline; property</h1>
    <p>It will convert the block level element into inline level element.</p>
    <div> Hello </div>
    <div> World </div>
</body>
</html>
