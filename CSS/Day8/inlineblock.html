<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            border: 2px solid red;
            display: inline-block;
            height: 100px;
            width: 100px;
        }
    </style>
</head>
<body>
    <h1>display:block; property</h1>
    <p>It will convert the block level element into inline level element and also we can set height and width.</p>
    <div>Hello World</div>
    <div>Hello World</div>
</body>
</html>
