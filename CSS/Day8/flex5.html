<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #parent{
            border: 5px solid red;
            height: 300px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 10px;
        }
        #parent>div{
            background-color: blueviolet;
            padding: 20px;
            color: white;
            font-size: 30px;
            width: 300px;

        }
        #child1{flex-shrink:1;}
        #child2{flex-shrink:2;}
        #child3{flex-shrink:0;}     /* dont shrink*/
        #child4{flex-shrink:4;}
        
    </style>
</head>
<body>
    <div id="parent">
        <div id="child1">child1</div>
        <div id="child2">child2</div>
        <div id="child3">child3</div>
        <div id="child4">child4</div>
    </div>
</body>
</html>
