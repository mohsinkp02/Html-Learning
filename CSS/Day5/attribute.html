<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a[target="_blank"]{
            border: 2px solid red;
        }
        input[type="password"]{
            background-color: red;
        }
    </style>
</head>
<body>
    <h1>Attribute selector</h1>
    <p>Used to targe the elements based on attribute name and value</p>
    <input type="text" name="username">
    <input type="text" name="fname">
    <input type="password" name="password">

    <a href="https://www.facebook.com" target="_blank">click</a>
    <a href="https://www.amazon.com" target="_blank">click</a>
    <a href="">click</a>
    <a href="">click</a>
    
</body>
</html>
