<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            margin:20px;padding:20px;border-width:10px;
        }
        #div1{
            border-style: solid;border-color: red;
        }
        #div2{
            border-style: dotted;border-color: blue;
        }
        #div3{
            border-style: dashed;border-color: green;
        }
        #div4{
            border-style: double;
        }
        #div5{
            border-style: inset;
        }
        #div6{
            border-style: outset;
        }
        #div7{
            border-style: ridge;
        }
        #div8{
            border-style: groove;
        }
        #div9{
            border:10px solid red;
            height: 200px;
            width: 200px;
            border-radius: 50%;
            padding: 0px;
        }
        
        
    </style>
</head>
<body>
    <div id="div1">border-style:solid</div>
    <div id="div2">border-style:dotted</div>
    <div id="div3">border-style:dashed</div>
    <div id="div4">border-style:double</div>
    <div id="div5">border-style:inset</div>
    <div id="div6">border-style:outset</div>
    <div id="div7">border-style:ridge</div>
    <div id="div8">border-style:groove</div>
    <div id="div9">border Shorthand property</div>
    <br><br><br><br><br><br><br><br>
</body>
</html>
