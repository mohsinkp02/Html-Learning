<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook</title>
    <link rel="shortcut icon"
        href="https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6c/Facebook_Logo_2023.png/1280px-Facebook_Logo_2023.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=thumbnail&_=20231011121526"
        type="image/x-icon">
    <style>
        *{
            font-family: sans-serif;
            padding: 0px;

        }
        #img1 {
            margin-top: 40px;
            margin-left: 30px;
        }

        h1 {
            font-size: 50px;
            width: 300px;
            margin-top: 300px;
        }
        #span2{
            font-size: 50px;
            width: 200px;
            display: inline-block;
        }

        #span1 {
            color: blue;
            display: inline-block;
        }

        #img2 {
            margin-left: 150px;
            margin-top: -1600px;
        }

        #input1,
        #input2 {
            width: 400px;
            border-radius: 10px;
            padding: 10px;
            border: 2px solid gray;
        }

        #input1:hover,
        #input2:hover {
            border-color: black;
        }

        button {
            width: 320px;
            border-radius: 20px;
            background-color: blue;
            color: white;
            padding: 10px;
        }

        #link1 {
            text-decoration: none;

        }

            margin-left: 950px;

        }

</head>

<body>
    <img id="img1" height="60" width="60"

        alt="">
    <h1><span id="span2">Explore the things</span> <span id="span1">you love</span></h1>
    <img id="img2" height="600" width="600" src="https://static.xx.fbcdn.net/rsrc.php/y0/r/U45qBJmWVHU.webp" alt="">

    <div>
        <form action="">

            <input type="text" id="input1" name="email" placeholder="Email address or mobile number">
            <br><br>
            <input type="text" id="input2" name="email" placeholder="Password">
            <br><br>
            <button>Log in</button>

        </form>
        <br><br>
        <a id="link1"
            href="https://www.facebook.com/recover/initiate/?privacy_mutation_token=eyJ0eXBlIjo1LCJjcmVhdGlvbl90aW1lIjoxNzg4NjA1MTczfQ%3D%3D&ars=facebook_login">Forgotten password?</a>
