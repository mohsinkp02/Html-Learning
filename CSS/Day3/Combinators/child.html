<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div>span{
            background-color: aqua;
        }
    </style>
</head>
<body>
    <h1>Child Sibling Combinator selector</h1>
    <p>Used to target all the direct members of the specified tag.</p>
    <p>It is represented with space >.</p>
    <div>
        <h1>direct member of div</h1>
        <p>direct member of div</p>
        <span>
            <h1>indirect member of div</h1>
            <img src="" alt="indirect member of div">
            <p>indirect member of div</p>
        </span>
    </div>

</body>
</html>
