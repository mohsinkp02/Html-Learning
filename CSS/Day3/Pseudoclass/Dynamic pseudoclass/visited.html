<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a:visited {
            color: aquamarine;
        }
    </style>
</head>

<body>
    <h1>Link pseudo class selector</h1>
    <p>Used to target the visited state of the hyper link</p>
    <a href="aldj">facebook</a>
    <a href="dfssd">amazon</a>
    <a href="adff">youtube</a>
</body>

</html>
