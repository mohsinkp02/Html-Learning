<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #input1:focus {
            color: white;
            background-color: red;
        }
        #input2:focus{
            background-color: black;
            color: white;
        }
        #input3:focus{
            background-color: blue;
            color: white;
        }
    </style>

</head>

<body>
    <h1>Focus pseudo class selector</h1>
    <p>Used to target the focused state of the input</p>
    <input type="text" id="input1">
    <input type="text" id="input2">
    <input type="text" id="input3">
</body>

</html>
