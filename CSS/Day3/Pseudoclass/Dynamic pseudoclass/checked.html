<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input:checked {
            accent-color: green;
        }
    </style>

</head>

<body>
    <h1>Checked pseudo class selector</h1>
    <p>Used to target the checked state of the radio and checkboxes</p>
    <input type="radio" name="gender" value="male">Male
    <input type="radio" name="gender" value="female">Female
    <br><br>
    Language:
    <input type="checkbox" name="lang" id="" value="Hindi">Hindi
    <input type="checkbox" name="lang" id="" value="English">English


</body>

</html>
