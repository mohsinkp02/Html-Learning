<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1:hover {
            background-color: red;
        }

        p:hover {
            background-color: aqua;
        }

        #item1:hover{
            background-color: red;
        }
        #item2:hover{
            background-color: green;
        }
        #item3:hover{
            background-color: blue;
        }
        #item4:hover{
            background-color: orange;
        }
        #item5:hover{
            background-color: yellow;
        }
    </style>

</head>

<body>
    <h1>Hover pseudo class selector</h1>
    <p>Used to target the hover state of any element</p>
    <p>when user place the curso on the element then we can say it is in hover state.</p>
    <ul>
        <li id="item1">red</li>
        <li id="item2">green</li>
        <li id="item3">blue</li>
        <li id="item4">orange</li>
        <li id="item5">yellow</li>
    </ul>

</body>

</html>
