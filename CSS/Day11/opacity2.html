<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            text-align: center;
            animation-name: fade;
            animation-duration: 1s;
            animation-iteration-count: infinite;
        }
        @keyframes fade{
            0%{
                opacity: 0;
                transform: scale(1);
            }
            50%{
                opacity: 1;
                transform: scale(1.5);
            }
            100%{
                opacity: 0;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <h1>Opacity property</h1>
</body>
</html>
