<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #parent{
            display: flex;
            justify-content: center;

        }
        #div1{
            height: 200px;
            width: 200px;
            background-color: white;
            opacity: 0.3;

        }

        body{ 
            background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQX527FgayQgoM7SCdlPQFlqHRZY1v4We_4STd7DuBIORE-waO9ipK2RIc&s=10);
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Opacity property</h1>
    <p>Used to give transparency to the element.</p>
    <p>value must be between 0 and 1.</p>

    <div id="parent">
        <div id="div1"></div>
    </div>

</body>
</html>
