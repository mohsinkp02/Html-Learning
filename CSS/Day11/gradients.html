<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #parent{
            display: flex;
            justify-content: space-around;
        }
        /* #div1 */
        #div1 {
            transition: all 1s;
            height: 200px;
            width: 200px;
            border: 2px solid;
            border-radius: 10px;
            background-image: linear-gradient(45deg, red, blue, yellow, orange, indigo, aqua, brown, pink, violet, blueviolet);
        }

        #div2 {
            transition: all 1s;
            height: 200px;
            width: 200px;
            border: 2px solid;
            border-radius: 10px;
            background-image: radial-gradient(red, blue, yellow, orange, indigo, aqua, brown, pink, violet, blueviolet);
        }
        #div3 {
            transition: all 1s;
            height: 200px;
            width: 200px;
            border: 2px solid;
            border-radius: 10px;
            background-image: conic-gradient(red, blue, yellow, orange, indigo, aqua, brown, pink, violet, blueviolet);
        }
        #div1:hover,#div2:hover,#div3:hover{
            transform: scale(1.2);
        }
    </style>
</head>

<body>
    <h1>Gradients</h1>
    <div id="parent">
        <div id="div1"></div>
        <div id="div2"></div>
        <div id="div3"></div>
    </div>
    <div id="parent">
        <p>linear-gradient</p>
        <p>radial-gradient</p>
        <p>conic-gradient</p>
    </div>
</body>

</html>
