<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
        Attributes:- 
        marquee tag:- used to scroll the content on the screen
             
    -->
    <marquee>Hello World</marquee>
    <marquee direction="right">Hello World</marquee>
    <marquee direction="up">Hello World</marquee>
    <hr>
    <marquee direction="down">Hello World</marquee>
    <hr>
    <marquee scrollamount="100">Hello World</marquee>
    <marquee scrollamount="10">Hello World</marquee>

    <hr>
    <marquee scrollamount="30" behavior="scroll">Hello World</marquee>
    <marquee scrollamount="30" behavior="alternate">Hello World</marquee>
    <marquee scrollamount="30" behavior="slide">Hello World</marquee>
    <hr>

    <h1><marquee direction="left" behavior="alternate" scrollamount="50">ALTERNATE</marquee></h1>
    <h1><marquee direction="right" behavior="slide" scrollamount="50">SLIDE</marquee></h1>
    <marquee direction="up"  scrollamount="10">Mohsin Khan</marquee>
    <marquee direction="down"  scrollamount="10">Mohsin Khan</marquee>
    
    <p>Lorem ipsum dolor sm aperiam et assumenda rem modi debitis, magnam inventore.</p><p>Hello World</p>



</body>
</html>
