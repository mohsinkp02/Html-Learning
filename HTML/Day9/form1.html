<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <input type="text" name="username" placeholder="Enter Username" minlength="10" maxlength="20" required autofocus autocomplete="on" size="50"> <br>
        <input type="password" name="password" placeholder="Password" pattern="[a-z]" required autocomplete="on"> <br>
        <input type="number" name="age" placeholder="Enter the age" min="18" max="50"> <br>
        Gender: <br>
        <input type="radio" name="gender" value="male" checked>male <br>
        <input type="radio" name="gender" value="female" >Female <br>
        <input type="radio" name="gender" value="others" disabled>Others <br><br>

        Languages: <br>
        <input type="checkbox" name="lang" value="English" checked>English <br>
        <input type="checkbox" name="lang" value="Hindi" >Hindi <br>
        <input type="checkbox" name="lang" value="Telugu" disabled>Telugu <br>
        Resume: <input type="file" name="Resume" accept=".jpg,.pdf">
        <br>
        deptno: <input type="text" name="deptno" value="30" readonly > <br>
        College: <input type="text" name="college" list="college" autofocus>
        <datalist id="college"> <!--suggestions and custom values-->
            <option value="bvr">BVR COLLEGE</option>
            <option value="rjuvt">Rajiv Gandhi University</option>
            <option value="RSR">RSR college</option>
        </datalist>
        <br>
        <label for="location">Location :</label>
        <select name="location" id="location">
            <option value="Chennai">Chennai</option>
            <option value="Banglore">Banglore</option>
            <option value="Mumbai">Mumbai</option>
            <option value="pune">Mumbai</option>
        </select>



        <br>
        <button>Submit</button>
    </form>

    <!-- 
    Attributes of input:
    type
    name
    value
    placeholder
    required
    autofocus
    minlength
    maxlength
    autocomplete
    size
    min
    max
    pattern
    accept
    checked
    disabled
    -->



</body>
</html>
