<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="">
        <label for="un">Username:</label>
        <input type="text" name="username" id="un"><br>
        <label for="pwd">Password:</label>
        <input type="password" name="password" id="pwd"><br>
        <label for="email">Email:</label>
        <input type="email" name="email" id="email"><br>
        <label for="age">Age:</label>
        <input type="number" name="age" id="age"><br>
        <label for="dob">Date of Birth:</label>
        <input type="date" name="DOB" id="dob"><br>
        <label for="Resume">Resume</label>
        <input type="file" name="Resume" id="Resume"><br>
        <label for="mob">Mobile No.:</label>
        <input type="tel" name="Mobile" id="mob"><br>
        <label for="gender">Gender</label>
        <input type="radio" name="Gender" value="male">male
        <input type="radio" name="Gender" value="female">female<br>
        <label for="lang">Languages</label> <br>
        <input type="checkbox" name="Languages" id="lang" value="eng">English <br>
        <input type="checkbox" name="Languages" id="lang" value="marathi">Marathi <br>
        <input type="checkbox" name="Languages" id="lang" value="hindi">Hindi <br>
        <input type="checkbox" name="Languages" id="lang" value="telugu">Telugu <br>
        month :<input type="month" name="month"> <br><br>
        Time :<input type="time" name="time"> <br><br>
        Volume :<input type="range" name="volume" > <br><br>
        Dept :<input type="hidden" name="dept" value="30"> <br><br>
        URL :<input type="url" name="url"> <br>
        Search : <input type="search" name="search"> <br>
        week : <input type="week" name="week"> <br>

        <input type="reset">
        <!-- <input type="Submit"> -->
       <button>Submit</button>

    </form>

</body>
