<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="">
        <fieldset>
            <legend>Personal Details</legend>
            <input type="text" name="username" placeholder="Username"> <br><br>
            <input type="email" name="email" placeholder="Enter the Email" size="30">

        </fieldset>

        <fieldset>
            <legend>Educational Details</legend>
            <input type="number" name="age" placeholder="age"> <br><br>
            <input type="tel" name="mobile" placeholder="Mobile Number"> <br><br>
            <input type="file" name="resume"> <br><br>
        </fieldset>

        <fieldset>
            <legend>Experience details</legend>
            <input type="date" name="dob">  <br><br>
            <input type="month" name="month"> <br><br>
            <input type="time" name="name"> <br><br>
        </fieldset>
        <br>
        <fieldset>
            <label for="url">URL:</label>
            <input type="url" name="url" id="url">   <br><br>
            <input type="week" name="week"> <br><br>
            <input type="range" name="volume"><br><br>
            <input type="radio" name="gender" value="male" id="male">
            <label for="male">male</label>
            <input type="radio" name="gender" value="female" id="f">
            <label for="f">female</label>
            <input type="checkbox" name="lang" value="English" id="English">
            <label for="English">English</label>
            <input type="checkbox" name="lang" value="Marathi" id="Marathi">
            <label for="Marathi">Marathi</label>
            <input type="checkbox" name="lang" value="Hindi" id="Hindi">
            <label for="Hindi">Hindi</label> <br><br>
            Search: <input type="search" name="search"> <br><br>
            <input type="color" name="color">
            <br><br>
            <label for="loc">Location</label>
            <select name="location" id="loc">
                <option value="banglore">Banglore</option>
                <option value="Hyderabad">Hyderabad</option>
                <option value="Chennai">Chennai</option>
            </select>
            <br><br>
            <textarea name="feedback" id="" placeholder="feedback"></textarea>




        </fieldset>


        <button >Submit</button>
    </form>
</body>
</html>
