<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <fieldset>
            <legend>Employee Details</legend>
            <label for="fn">First Name: </label>
            <input type="text" name="first name" id="fn"> <br><br>
            <label for="ln">Last Name:</label>
            <input type="text" name="last name" id="ln"> <br><br>
            <label >Gender:</label>
            <input type="radio" name="gender" value="male" id="m">
            <label for="m">Male</label>
            <input type="radio" name="gender" value="female" id="f">
            <label for="f">Female</label><br><br>
            <label for="eid">Employee ID:</label>
            <input type="text" name="employee id" id="eid"><br><br>
            <label for="designation">Designation:</label>
            <input type="text" name="designation" id="designation"><br><br>
            <label for="pno">Phone Number: </label>
            <input type="number" name="phone no" id="pno"><br><br>
            <button>Submit</button>




        </fieldset>
    </form>
</body>
</html>
